    <style>
        @import url('https://fonts.googleapis.com/css?family=Quattrocento+Sans');

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
        }

        .loading-text {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            margin: auto;
            text-align: center;
            width: 100%;
            height: 100px;
            line-height: 100px;
        }

        .loading-text span {
            display: inline-block;
            margin: 0 5px;
            font-family: 'Quattrocento Sans', sans-serif;
        }
        
        .loading-text span:nth-child(1) { filter: blur(0px); animation: blur-text 1.5s 0s infinite ease-in-out alternate; }
        .loading-text span:nth-child(2) { filter: blur(0px); animation: blur-text 1.5s 0.2s infinite ease-in-out alternate; }
        .loading-text span:nth-child(3) { filter: blur(0px); animation: blur-text 1.5s 0.4s infinite ease-in-out alternate; }
        .loading-text span:nth-child(4) { filter: blur(0px); animation: blur-text 1.5s 0.6s infinite ease-in-out alternate; }
        .loading-text span:nth-child(5) { filter: blur(0px); animation: blur-text 1.5s 0.8s infinite ease-in-out alternate; }
        .loading-text span:nth-child(6) { filter: blur(0px); animation: blur-text 1.5s 1.0s infinite ease-in-out alternate; }
        .loading-text span:nth-child(7) { filter: blur(0px); animation: blur-text 1.5s 1.2s infinite ease-in-out alternate; }

        @keyframes blur-text {
            0% { filter: blur(0px); opacity: 1; }
            100% { filter: blur(6px); opacity: 0.4; }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; border: 2px solid #f8fafc; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        html.dark ::-webkit-scrollbar-thumb { background: #475569; border-color: #2b2d2b; }
        html.dark ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .grid-bg {
            background-color: #f8fafc;
            background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px), linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
            background-size: 24px 24px;
        }
        
        html.dark .grid-bg {
            background-color: #353935;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.08), transparent 25%),
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), 
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            background-position: 0 0, 0 0, center top, center top;
        }

        /* tooltip settings 👇 */
        .copy {
          /* button */
          --button-bg: #353434;
          --button-hover-bg: #464646;
          --button-text-color: #CCCCCC;
          --button-hover-text-color: #8bb9fe;
          --button-border-radius: 10px;
          --button-diameter: 32px; /* Set smaller */
          --button-outline-width: 1px;
          --button-outline-color: rgb(141, 141, 141);
          /* tooltip */
          --tooltip-bg: #f4f3f3;
          --toolptip-border-radius: 4px;
          --tooltip-font-family: Menlo, Roboto Mono, monospace;
          --tooltip-font-size: 12px;
          --tootip-text-color: rgb(50, 50, 50);
          --tooltip-padding-x: 7px;
          --tooltip-padding-y: 7px;
          --tooltip-offset: 8px;
        }
        
        .copy {
          box-sizing: border-box;
          width: var(--button-diameter);
          height: var(--button-diameter);
          border-radius: var(--button-border-radius);
          background-color: var(--button-bg);
          color: var(--button-text-color);
          border: none;
          cursor: pointer;
          position: relative;
          outline: none;
        }
        
        .tooltip {
          position: absolute;
          opacity: 0;
          visibility: hidden;
          top: 0;
          left: 50%;
          transform: translateX(-50%);
          white-space: nowrap;
          font: var(--tooltip-font-size) var(--tooltip-font-family);
          color: var(--tootip-text-color);
          background: var(--tooltip-bg);
          padding: var(--tooltip-padding-y) var(--tooltip-padding-x);
          border-radius: var(--toolptip-border-radius);
          pointer-events: none;
          transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .tooltip::before {
          content: attr(data-text-initial);
        }
        
        .tooltip::after {
          content: "";
          position: absolute;
          bottom: calc(var(--tooltip-padding-y) / 2 * -1);
          width: var(--tooltip-padding-y);
          height: var(--tooltip-padding-y);
          background: inherit;
          left: 50%;
          transform: translateX(-50%) rotate(45deg);
          z-index: -999;
          pointer-events: none;
        }
        
        .copy svg {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
        }
        
        .checkmark {
          display: none;
        }
        
        /* actions */
        .copy:focus:not(:focus-visible) .tooltip {
          opacity: 1;
          visibility: visible;
          top: calc((100% + var(--tooltip-offset)) * -1);
        }
        
        .copy:focus:not(:focus-visible) .tooltip::before {
          content: attr(data-text-end);
        }
        
        .copy:focus:not(:focus-visible) .clipboard {
          display: none;
        }
        
        .copy:focus:not(:focus-visible) .checkmark {
          display: block;
        }
        
        .copy:hover,
        .copy:focus {
          background: linear-gradient(270deg, var(--button-hover-bg), #5e5e5e, var(--button-hover-bg));
          background-size: 200% 200%;
          animation: bg-pan 3s ease infinite;
        }
        
        .copy:active {
          outline: var(--button-outline-width) solid var(--button-outline-color);
        }
        
        .copy:hover svg {
          color: var(--button-hover-text-color);
        }

        @keyframes bg-pan {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .animated-bg-hover {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(0px) scale3d(1, 1, 1);
            position: relative;
        }

        .animated-bg-hover::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(
                400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                rgba(255, 255, 255, 0.6), 
                transparent 40%
            );
            opacity: 0;
            transition: opacity 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            mix-blend-mode: overlay;
            z-index: 10;
        }
        
        .animated-bg-hover:hover::before {
            opacity: 1;
        }
        
        .animated-bg-hover:hover {
            transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-5px) scale3d(1.02, 1.02, 1.02);
            border-color: #cbd5e1;
            box-shadow: -10px 15px 25px -5px rgba(0, 0, 0, 0.1), -4px 6px 10px -2px rgba(0, 0, 0, 0.05);
            z-index: 10;
        }
        
        html.dark .animated-bg-hover::before {
            background: radial-gradient(
                400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                rgba(255, 255, 255, 0.15), 
                transparent 40%
            );
        }
        
        html.dark .animated-bg-hover:hover {
            border-color: #475569;
            transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(-5px) scale3d(1.02, 1.02, 1.02);
            box-shadow: -10px 15px 25px -5px rgba(0, 0, 0, 0.4), -4px 6px 10px -2px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }
    </style>
</head>

    <script>
        let menuOpen = false;
        function toggleMenu() {
            menuOpen = !menuOpen;
            const menu = document.getElementById('mobileMenu');
            const bar1 = document.getElementById('bar1');
            const bar2 = document.getElementById('bar2');
            const bar3 = document.getElementById('bar3');
            if (menuOpen) {
                menu.classList.remove('hidden');
                menu.classList.add('flex');
                bar1.classList.add('rotate-45', 'translate-y-2');
                bar2.classList.add('opacity-0');
                bar3.classList.add('-rotate-45', '-translate-y-2');
            } else {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
                bar1.classList.remove('rotate-45', 'translate-y-2');
                bar2.classList.remove('opacity-0');
                bar3.classList.remove('-rotate-45', '-translate-y-2');
            }
        }
    </script>

    <script type="py">
        import js
        import json
        import sqlite3
        import sqlparse
        import base64

        conn = None
        c = None

        def init_db():
            global conn, c
            if conn:
                conn.close()
            conn = sqlite3.connect(":memory:")
            c = conn.cursor()

        init_db() # Starts completely empty as requested

        def get_db_state():
            state = {"tables": [], "error": None}
            try:
                c.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'")
                tables = [r[0] for r in c.fetchall()]
                for table in tables:
                    c.execute(f"PRAGMA table_info({table})")
                    columns = [{"name": info[1], "type": info[2], "pk": info[5]} for info in c.fetchall()]
                    
                    c.execute(f"PRAGMA foreign_key_list({table})")
                    foreign_keys = [{"from": fk[3], "table": fk[2], "to": fk[4]} for fk in c.fetchall()]
                    
                    c.execute(f"SELECT * FROM {table} LIMIT 10")
                    rows = c.fetchall()
                    
                    state["tables"].append({
                        "name": table,
                        "columns": columns,
                        "foreign_keys": foreign_keys,
                        "rows": rows
                    })
            except Exception as e:
                state["error"] = str(e)
            return json.dumps(state)

        def validate_sql():
            query = js.window.getCurrentQuery()
            if not query or not query.strip():
                js.window.clearSyntaxError()
                return

            try:
                parsed = sqlparse.split(query)
                for stmt in parsed:
                    stmt_str = stmt.strip()
                    if stmt_str and not stmt_str.startswith('--'):
                        c.execute(f"EXPLAIN {stmt_str}")
                js.window.clearSyntaxError()
            except sqlite3.OperationalError as e:
                js.window.showSyntaxError(f"Syntax Error: {str(e)}")
            except sqlite3.Warning:
                pass
            except Exception as e:
                js.window.showSyntaxError(str(e))
        
        js.window.validate_sql_python = validate_sql

        def run_query():
            query = js.window.getCurrentQuery()
            js.window.clearSyntaxError()
            
            if not query or not query.strip():
                js.window.renderVisualizer(get_db_state())
                return

            try:
                parsed = sqlparse.split(query)
                for stmt in parsed:
                    stmt_str = stmt.strip()
                    if stmt_str and not stmt_str.startswith('--'):
                        c.execute(stmt_str)
                conn.commit()
                js.window.renderVisualizer(get_db_state())
            except Exception as e:
                js.window.showSyntaxError(f"Execution Error: {str(e)}")
                # Render DB state even if error to keep visualizer updating on valid queries
                js.window.renderVisualizer(get_db_state())

        js.window.run_sql_python = run_query

        def reset_db_python():
            init_db()
            js.window.clearEditor()
            js.window.renderVisualizer(get_db_state())

        js.window.reset_db_python = reset_db_python

        def format_sql():
            query = js.window.getCurrentQuery()
            if not query or not query.strip():
                return
            try:
                formatted = sqlparse.format(query, reindent=True, keyword_case='upper')
                js.window.setEditorValue(formatted)
            except Exception:
                pass

        js.window.format_sql_python = format_sql

        def export_db():
            try:
                dest = sqlite3.connect("backup.db")
                conn.backup(dest)
                dest.close()
                with open("backup.db", "rb") as f:
                    b64_content = base64.b64encode(f.read()).decode("utf-8")
                js.window.downloadDbFile(b64_content)
            except Exception as e:
                js.window.showSyntaxError(f"Export Error: {str(e)}")

        js.window.export_db_python = export_db

        def import_sql(sql_text):
            try:
                c.executescript(sql_text)
                conn.commit()
                js.window.setEditorValue(sql_text)
                js.window.renderVisualizer(get_db_state())
            except Exception as e:
                js.window.showSyntaxError(f"Import Error: {str(e)}")
        
        js.window.import_sql_python = import_sql

        def import_sql_silent(sql_text):
            try:
                init_db()
                c.executescript(sql_text)
                conn.commit()
                js.window.renderVisualizer(get_db_state())
            except Exception:
                pass
        
        js.window.import_sql_python_silent = import_sql_silent
        
        js.window.pythonReady()
    </script>
    
    <script>
        window.isPythonReady = false;
        window.debounceTimer = null;
        window.validationTimer = null;
        window.editor = null;
        window.lastGeneratedERDSql = '';

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'erd_updated') {
                window.lastGeneratedERDSql = e.data.sql;
                
                // Silently compile updated ERD layout into the Python SQLite instance to update cards
                if (window.isPythonReady && window.import_sql_python_silent) {
                    window.import_sql_python_silent(e.data.sql);
                }
                
                // If SQL Editor is entirely empty, make sure it populates automatically so it feels fully interconnected
                const currentQuery = window.getCurrentQuery().trim();
                if (!currentQuery) {
                    window.setEditorValue(e.data.sql);
                }
            }
        });

        window.syncFromVisualCanvas = function() {
            if (window.lastGeneratedERDSql) {
                window.setEditorValue(window.lastGeneratedERDSql);
                if (window.isPythonReady && window.import_sql_python_silent) {
                    window.import_sql_python_silent(window.lastGeneratedERDSql);
                }
                
                // Update the status text to show successful alignment
                const status = document.getElementById('sync-status');
                if (status) {
                    status.innerHTML = `<span class="text-indigo-600 dark:text-indigo-400 font-semibold">Synced schema from Visual ERD Generator!</span>`;
                    setTimeout(() => {
                        if (window.currentVisualizerState) {
                            window.renderVisualizer(JSON.stringify(window.currentVisualizerState));
                        }
                    }, 2000);
                }
            } else {
                // Request SQL from ERD canvas iframe if not fetched yet
                const iframe = document.getElementById('erd-generator-view');
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage({ type: 'request_sql' }, '*');
                }
            }
        };

        function escapeHtml(unsafe) {
            if (unsafe == null) return "NULL";
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        window.pythonReady = function() {
            window.isPythonReady = true;
            document.getElementById('status-overlay').classList.add('opacity-0', 'pointer-events-none');
            
            if (window.editor) { 
                window.run_sql_python();
            }
        };

        window.getCurrentQuery = function() {
            return window.editor ? window.editor.getValue() : "";
        };

        window.clearEditor = function() {
            if (window.editor) window.editor.setValue("");
        }

        window.formatSQL = function() {
            if(window.isPythonReady && window.format_sql_python) window.format_sql_python();
        }

        window.setEditorValue = function(text) {
            if (window.editor) {
                const model = window.editor.getModel();
                window.editor.executeEdits("beautifier", [{
                    range: model.getFullModelRange(),
                    text: text
                }]);
            }
        }

        window.exportDB = function() {
            if(window.isPythonReady && window.export_db_python) window.export_db_python();
        };

        window.downloadDbFile = function(b64) {
            const binStr = atob(b64);
            const bytes = new Uint8Array(binStr.length);
            for (let i = 0; i < binStr.length; i++) {
                bytes[i] = binStr.charCodeAt(i);
            }
            const blob = new Blob([bytes], {type: "application/octet-stream"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "prime_sql_backup.db";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        window.handleImportSql = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                if (window.isPythonReady && window.import_sql_python) {
                    window.import_sql_python(text);
                }
            };
            reader.readAsText(file);
            event.target.value = "";
        };

        window.resetDB = function() {
            if(window.isPythonReady) window.reset_db_python();
        }

                        <div class="w-full px-5 py-8 text-xs text-slate-450 dark:text-slate-500 italic flex items-center justify-center text-center bg-transparent">
                            <div class="flex flex-col items-center gap-1">
                                <svg class="w-8 h-8 text-slate-300 dark:text-slate-700 stroke-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 7v10c0 2 1 3 3 3h10c2 0 3-1 3-3V7c0-2-1-3-3-3H7c-2 0-3 1-3 3z"></path></svg>
                                <span>No rows inserted yet</span>
                            </div>
                        </div>
                    `;
                } else {
                    rowsHtml = `
                        <div class="overflow-x-auto max-h-64 custom-scrollbar">
                            <table class="w-full text-xs text-left border-collapse">
                                <thead class="bg-slate-50/60 dark:bg-slate-900/45 sticky top-0 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
                                    <tr>
                                        ${table.columns.map(col => `
                                            <th class="py-2.5 px-4 font-semibold text-slate-700 dark:text-slate-300 border-b border-slate-200 dark:border-slate-800 whitespace-nowrap text-[11px] font-mono">
                                                ${escapeHtml(col.name)}
                                            </th>
                                        `).join('')}
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-150/40 dark:divide-slate-800/40">
                                    ${table.rows.map(row => `
                                        <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition-colors">
                                            ${row.map(cell => `
                                                <td class="py-2.5 px-4 whitespace-nowrap overflow-hidden text-ellipsis max-w-[170px] text-slate-600 dark:text-slate-300 font-mono text-[11px]">
                                                    ${escapeHtml(cell !== null && cell !== undefined ? String(cell) : 'NULL')}
                                                </td>
                                            `).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                }

                html += `
                    <div class="bg-white dark:bg-[#3f433f]/50 border border-slate-200 dark:border-slate-700/60 rounded-xl shadow-sm hover:shadow-md transition-all hover:border-slate-300 dark:hover:border-slate-600 md:w-[480px] w-72 flex-shrink-0 backdrop-blur-xl overflow-hidden animated-bg-hover flex flex-col items-stretch">
                        <div class="w-full bg-slate-50 dark:bg-slate-900/50 px-4 py-2.5 border-b border-slate-200 dark:border-slate-700/60 font-semibold text-xs text-slate-900 dark:text-white flex justify-between items-center">
                            <span class="tracking-tight font-medium">${escapeHtml(table.name)}</span>
                            <button onclick="exportTableCSV('${escapeHtml(table.name)}')" class="p-1.5 rounded-md hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors text-slate-500 dark:text-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-500/50" title="Export CSV">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            </button>
                        </div>
                        <div class="w-full px-4 py-2 flex flex-wrap gap-1.5 items-center bg-slate-50/10 dark:bg-slate-900/10 border-b border-slate-150 dark:border-slate-800/30">
                            <span class="text-[9px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mr-1.5">Columns:</span>
                            ${columnBadges}
                        </div>
                        <div class="w-full flex-1">
                            ${rowsHtml}
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
            
            // Add dynamic 3D tilt effect logic to cards
            container.querySelectorAll('.animated-bg-hover').forEach(card => {
                card.addEventListener('mousemove', e => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;
                    const rotateX = ((y - centerY) / centerY) * -15; // Max 15 degree rotation
                    const rotateY = ((x - centerX) / centerX) * 15;
                    card.style.setProperty('--rx', `${rotateX}deg`);
                    card.style.setProperty('--ry', `${rotateY}deg`);
                    card.style.setProperty('--mouse-x', `${x}px`);
                    card.style.setProperty('--mouse-y', `${y}px`);
                });
                card.addEventListener('mouseleave', () => {
                    card.style.setProperty('--rx', `0deg`);
                    card.style.setProperty('--ry', `0deg`);
                });
            });
        };

        window.MonacoEnvironment = {
            getWorkerUrl: function(workerId, label) {
                return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
                    'self.MonacoEnvironment = { baseUrl: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/" };' +
                    'importScripts("https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/base/worker/workerMain.js");'
                );
            }
        };

        require.config({ 
            paths: { 
                'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs',
                'stackframe': 'https://cdn.jsdelivr.net/npm/stackframe@1.3.4/dist/stackframe.min',
                'error-stack-parser': 'https://cdn.jsdelivr.net/npm/error-stack-parser@2.1.4/dist/error-stack-parser.min'
            }
        });

        require(['vs/editor/editor.main'], function() {
            // Very subtle theme adjustment for Monaco to match the light theme perfectly
            monaco.editor.defineTheme('light-paper', {
                base: 'vs',
                inherit: true,
                rules: [],
                colors: {
                    'editor.background': '#ffffff',
                    'editorLineNumber.foreground': '#cbd5e1',
                    'editorLineNumber.activeForeground': '#64748b',
                    'editorIndentGuide.background': '#f1f5f9',
                }
            });

            // Sick dark theme
            monaco.editor.defineTheme('sick-dark', {
                base: 'vs-dark',
                inherit: true,
                rules: [
                    { token: 'keyword', foreground: 'c678dd' },
                    { token: 'identifier', foreground: '61afef' },
                    { token: 'string', foreground: '98c379' },
                    { token: 'number', foreground: 'd19a66' }
                ],
                colors: {
                    'editor.background': '#2b2d2b',
                    'editor.lineHighlightBackground': '#3f433f50',
                    'editorLineNumber.foreground': '#475569',
                    'editorLineNumber.activeForeground': '#818cf8',
                    'editorIndentGuide.background': '#3f433f',
                    'editorWidget.background': '#2b2d2b',
                    'editorWidget.border': '#334155'
                }
            });

            const isDark = document.documentElement.classList.contains('dark');
            window.editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: "",
                language: 'sql',
                theme: isDark ? 'sick-dark' : 'light-paper',
                minimap: { enabled: false },
                automaticLayout: true,
                fontSize: 13,
                fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
                lineHeight: 22,
                padding: { top: 16, bottom: 16 },
                scrollBeyondLastLine: false,
                renderLineHighlight: 'gutter',
                overviewRulerBorder: false,
                hideCursorInOverviewRuler: true,
                wordWrap: 'on'
            });

            window.editor.onDidChangeModelContent(() => {
                if (window.isPythonReady) {
                    clearTimeout(window.validationTimer);
                    window.validationTimer = setTimeout(() => {
                        if (window.validate_sql_python) window.validate_sql_python();
                    }, 300);

                    clearTimeout(window.debounceTimer);
                    window.debounceTimer = setTimeout(() => {
                        if (window.run_sql_python) window.run_sql_python();
                    }, 800);
                }
            });

            if (window.isPythonReady && window.run_sql_python) {
                window.run_sql_python();
            }
        });
    </script>

    <script>
        class GravityStars {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                if (!this.canvas) return;
                this.ctx = this.canvas.getContext('2d');
                this.stars = [];
                this.mouse = { x: -1000, y: -1000 };
                this.config = {
                    starsCount: 85,
                    starsSize: 1.5,
                    starsOpacity: 0.8,
                    glowIntensity: 15,
                    glowAnimation: 'ease',
                    movementSpeed: 0.4,
                    mouseInfluence: 120,
                    mouseGravity: 'attract',
                    gravityStrength: 80,
                    starsInteraction: false,
                };
                this.dpr = 1;

                this.resizeCanvas = this.resizeCanvas.bind(this);
                this.handlePointerMove = this.handlePointerMove.bind(this);
                this.animate = this.animate.bind(this);

                window.addEventListener('resize', this.resizeCanvas);
                // Listen on window to catch pointer everywhere regardless of z-index
                window.addEventListener('mousemove', this.handlePointerMove);
                window.addEventListener('touchmove', this.handlePointerMove);

                this.resizeCanvas();
                this.initStars();
                this.animate();
            }

            readColor() {
                return document.documentElement.classList.contains('dark') ? '#ffffff' : '#000000';
            }

            initStars() {
                const w = this.canvas.width / this.dpr;
                const h = this.canvas.height / this.dpr;
                this.stars = Array.from({ length: this.config.starsCount }).map(() => {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = this.config.movementSpeed * (0.5 + Math.random() * 0.5);
                    return {
                        x: Math.random() * w,
                        y: Math.random() * h,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: Math.random() * this.config.starsSize + 1,
                        opacity: this.config.starsOpacity,
                        baseOpacity: this.config.starsOpacity,
                        mass: Math.random() * 0.5 + 0.5,
                        glowMultiplier: 1,
                        glowVelocity: 0,
                    };
                });
            }

            resizeCanvas() {
                this.dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
                this.canvas.width = window.innerWidth * this.dpr;
                this.canvas.height = window.innerHeight * this.dpr;
            }

            handlePointerMove(e) {
                let clientX = 0, clientY = 0;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else if (e.clientX !== undefined) {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                const rect = this.canvas.getBoundingClientRect();
                this.mouse = { x: clientX - rect.left, y: clientY - rect.top };
            }

            updateStars() {
                const w = this.canvas.width / this.dpr;
                const h = this.canvas.height / this.dpr;
                const mouse = this.mouse;

                for (let i = 0; i < this.stars.length; i++) {
                    const p = this.stars[i];

                    const dx = mouse.x - p.x;
                    const dy = mouse.y - p.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < this.config.mouseInfluence && dist > 0) {
                        const force = (this.config.mouseInfluence - dist) / this.config.mouseInfluence;
                        const nx = dx / dist;
                        const ny = dy / dist;
                        const g = force * (this.config.gravityStrength * 0.001);

                        if (this.config.mouseGravity === 'attract') {
                            p.vx += nx * g;
                            p.vy += ny * g;
                        } else if (this.config.mouseGravity === 'repel') {
                            p.vx -= nx * g;
                            p.vy -= ny * g;
                        }

                        p.opacity = Math.min(1, p.baseOpacity + force * 0.4);

                        const targetGlow = 1 + force * 2;
                        const currentGlow = p.glowMultiplier || 1;

                        if (this.config.glowAnimation === 'ease') {
                            const ease = 0.15;
                            p.glowMultiplier = currentGlow + (targetGlow - currentGlow) * ease;
                        }
                    } else {
                        p.opacity = Math.max(p.baseOpacity * 0.3, p.opacity - 0.02);
                        const targetGlow = 1;
                        const currentGlow = p.glowMultiplier || 1;
                        if (this.config.glowAnimation === 'ease') {
                            const ease = 0.08;
                            p.glowMultiplier = Math.max(1, currentGlow + (targetGlow - currentGlow) * ease);
                        }
                    }

                    p.x += p.vx;
                    p.y += p.vy;

                    p.vx += (Math.random() - 0.5) * 0.001;
                    p.vy += (Math.random() - 0.5) * 0.001;
                    p.vx *= 0.999;
                    p.vy *= 0.999;

                    if (p.x < 0) p.x = w;
                    if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h;
                    if (p.y > h) p.y = 0;
                }
            }

            drawStars() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                const color = this.readColor();
                for (const p of this.stars) {
                    this.ctx.save();
                    this.ctx.shadowColor = color;
                    this.ctx.shadowBlur = this.config.glowIntensity * (p.glowMultiplier || 1) * 2;
                    this.ctx.globalAlpha = p.opacity;
                    this.ctx.fillStyle = color;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x * this.dpr, p.y * this.dpr, p.size * this.dpr, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                }
            }

            animate() {
                this.updateStars();
                this.drawStars();
                requestAnimationFrame(this.animate);
            }
        }

        // Initialize gravity stars when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            window.gravityStars = new GravityStars('gravity-stars-bg');

            const navBar = document.querySelector(".sidebar-nav"),
                menuBtns = document.querySelectorAll(".menu-icon"),
                overlay = document.querySelector(".overlay");
            
            if (menuBtns && navBar && overlay) {
                menuBtns.forEach((menuBtn) => {
                    menuBtn.addEventListener("click", () => {
                        navBar.classList.toggle("open");
                    });
                });
                overlay.addEventListener("click", () => {
                    navBar.classList.remove("open");
                });
            }
        });
    </script>
